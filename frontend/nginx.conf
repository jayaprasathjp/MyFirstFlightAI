server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html (and the app routes that fall back to it) must be re-checked on every visit,
        # otherwise browsers keep showing the previous deploy.
        add_header Cache-Control "no-cache";
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must never be cached, so new deploys reach users
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
