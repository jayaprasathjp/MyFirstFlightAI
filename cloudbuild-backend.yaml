steps:
  # 1. Build Docker image for FastAPI backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:latest'
      - './backend'

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'

  # 3. Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'myfirstflightai-backend'
      - '--image=gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=USE_VERTEX_AI=true,GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1,GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:latest'
