steps:
  # --- BACKEND ---
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'myfirstflightai-backend'
      - '--image=gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=USE_VERTEX_AI=true,GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1,GEMINI_MODEL=gemini-2.5-flash'

  # --- FRONTEND ---
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['deploy-backend']
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=$_VITE_API_BASE_URL'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'myfirstflightai'
      - '--image=gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

substitutions:
  _VITE_API_BASE_URL: 'https://myfirstflightai-backend-964832886801.us-central1.run.app'

images:
  - 'gcr.io/$PROJECT_ID/myfirstflightai-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
