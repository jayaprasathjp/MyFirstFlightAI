steps:
  # 1. Build Docker image for React frontend with build-arg
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=$_VITE_API_BASE_URL'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/myfirstflightai:latest'
      - './frontend'

  # 2. Push image to Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'

  # 3. Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'myfirstflightai'
      - '--image=gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=VITE_API_BASE_URL=$_VITE_API_BASE_URL,VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID'

substitutions:
  _VITE_API_BASE_URL: 'https://myfirstflightai-backend-964832886801.us-central1.run.app'
  _VITE_FIREBASE_API_KEY: 'dummy'
  _VITE_FIREBASE_AUTH_DOMAIN: 'dummy'
  _VITE_FIREBASE_PROJECT_ID: 'dummy'
  _VITE_FIREBASE_STORAGE_BUCKET: 'dummy'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: 'dummy'
  _VITE_FIREBASE_APP_ID: 'dummy'

images:
  - 'gcr.io/$PROJECT_ID/myfirstflightai:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/myfirstflightai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
